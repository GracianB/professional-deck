name: Professional Deck Production Smoke

on:
  page_build:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: V16 live contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PD_LIVE_URL: https://gracianb.github.io/professional-deck/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Production HTTP + Chromium contract
        run: node scripts/v16-live-smoke.mjs

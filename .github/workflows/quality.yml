name: Professional Deck Quality

on:
  push:
    branches: ["main", "refactor/css-cascade-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate
        run: npm run validate

      - name: Regression
        run: npm test

      - name: CSS cascade map
        run: node tools/css-cascade-map.mjs

      - name: Browser E2E
        run: npm run test:browser

      - name: Production Audit
        run: npm run audit:production

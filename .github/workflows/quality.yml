name: Professional Deck Quality

on:
  push:
    branches: ["main", "refactor/css-cascade-v1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate
        run: npm run validate

      - name: Regression
        run: npm test

      - name: Max Verification
        run: npm run verify

      - name: CSS cascade map
        run: node tools/css-cascade-map.mjs

      - name: CSS Cascade Guard
        run: npm run audit:css

      - name: V16 CSS Guard
        run: npm run audit:css:v16

      - name: Browser E2E
        run: npm run test:browser

      - name: Upload V16 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-deck-v16-${{ github.sha }}
          path: artifacts/v16
          if-no-files-found: warn
          retention-days: 14

      - name: Production Audit
        run: npm run audit:production

      - name: Performance Budget
        run: npm run audit:performance

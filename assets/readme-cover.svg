    <path d="M164 10V83M10 164H86M242 164h76M164 242v76" stroke="#c3d4dc" stroke-opacity=".26"/>
    <circle cx="164" cy="10" r="5" fill="#dbe8ed"/><circle cx="10" cy="164" r="4" fill="#a4c6d5"/><circle cx="318" cy="164" r="4" fill="#a4c6d5"/><circle cx="164" cy="318" r="4" fill="#dbe8ed"/>
    <rect x="70" y="82" width="188" height="164" rx="8" fill="#cbd8dd"/>

    <text x="164" y="158" fill="#15242d" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800">LISTEN</text>
    <text x="164" y="188" fill="#15242d" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800">DESIGN</text>
    <text x="164" y="218" fill="#15242d" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="800">ACTIVATE</text>

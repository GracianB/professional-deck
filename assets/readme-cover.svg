<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">Professional Deck — People. Operations. Systems that work.</title>
  <desc id="desc">A dark editorial portfolio cover with a platinum-blue decision-system graphic connecting customer signals, operational systems and adoption.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101922"/><stop offset=".58" stop-color="#0a1118"/><stop offset="1" stop-color="#111c25"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9bc9dd" stop-opacity=".14"/><stop offset="1" stop-color="#9bc9dd" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f3f6f7"/><stop offset="1" stop-color="#9bb1bd"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d5e5eb" stroke-opacity=".045"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1440" height="720" rx="26" fill="url(#bg)"/>
  <rect width="1440" height="720" rx="26" fill="url(#grid)"/>
  <ellipse cx="1110" cy="340" rx="420" ry="360" fill="url(#glow)" filter="url(#soft)"/>
  <path d="M0 5H1440" stroke="url(#metal)" stroke-width="6"/>
  <path d="M84 92h54v54H84z" fill="none" stroke="#c5d5dc" stroke-width="1.5"/>
  <text x="111" y="127" fill="#dce7eb" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="800">GB</text>
  <text x="162" y="112" fill="#dce7eb" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">GRACIÁN BAENA</text>
  <text x="162" y="140" fill="#91a5b0" font-family="monospace" font-size="12" letter-spacing="2">CUSTOMER SUCCESS  /  OPERATIONS  /  DATA  /  AI</text>
  <text x="84" y="252" fill="#a9bac2" font-family="monospace" font-size="14" font-weight="700" letter-spacing="3">PROFESSIONAL EVIDENCE · ES / EN</text>
  <text x="80" y="347" fill="#f2f5f6" font-family="Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-4">People. Operations.</text>
  <text x="80" y="438" fill="url(#metal)" font-family="Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-4">Systems that work.</text>
  <path d="M86 480H706" stroke="#bdcbd1" stroke-opacity=".3"/>
  <text x="86" y="526" fill="#c0cbd0" font-family="Arial,sans-serif" font-size="20">A career told through real work, clear decisions and</text>
  <text x="86" y="557" fill="#c0cbd0" font-family="Arial,sans-serif" font-size="20">evidence you can explore—not a list of claims.</text>
  <text x="86" y="634" fill="#93a9b5" font-family="monospace" font-size="12" letter-spacing="2">CUSTOMER → OPERATIONS → DATA → SYSTEM → ADOPTION</text>
  <g transform="translate(1004 192)">
    <circle cx="164" cy="164" r="154" fill="none" stroke="#c3d4dc" stroke-opacity=".18"/>

function bytes(b64){const str=atob(b64);return Uint8Array.from(str,c=>c.charCodeAt(0))}
document.getElementById("unlock").addEventListener("submit",async(event)=>{
  event.preventDefault();
  const btn=document.getElementById("submit");
  const err=document.getElementById("error");
  btn.disabled=true;btn.textContent="Abriendo la presentación…";err.textContent="";
  try{
    if(!crypto?.subtle||typeof DecompressionStream==="undefined")throw Error("Abre esta página en una versión reciente de Chrome o Edge mediante HTTPS.");
    const pass=document.getElementById("password").value;
    const material=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:bytes(SALT),iterations:ITERATIONS,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
    const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:bytes(IV)},key,bytes(PAYLOAD));
    const expanded=await new Response(new Blob([decrypted]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
    const html=new TextDecoder().decode(expanded);
    document.open();document.write(html);document.close();
  }catch(e){
    err.textContent=e.name==="OperationError"?"Contraseña incorrecta. Compruébala e inténtalo de nuevo.":(e.message||"No se pudo abrir el portfolio.");
    btn.disabled=false;btn.textContent="Entrar en el portfolio ↗";
  }
});
